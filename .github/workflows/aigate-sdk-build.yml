name: AiGate SDK Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.6.0)'
        required: true
        type: string
      openwrt_version:
        description: 'OpenWrt version (24.10 or 25.12 or both)'
        required: true
        default: '25.12'

permissions:
  contents: write
  id-token: write

jobs:
  generate_matrix:
    name: Generate matrix for ${{ matrix.ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref:
          - openwrt-24.10
          - openwrt-25.12
    steps:
      - name: Checkout OpenWrt repo
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ matrix.ref }}

      - name: Set targets
        id: find_targets
        run: |
          REF=${{ matrix.ref }}
          JSON='['
          FIRST=1
          while read -r line; do
            ARCH=$(echo "$line" | cut -d " " -f 1)
            [[ $FIRST -ne 1 ]] && JSON="$JSON"','
            FIRST=0
            JSON="$JSON"'{"arch":"'"$ARCH"'","ref":"'"$REF"'"}'
          done <<< $(perl ./scripts/dump-target-info.pl architectures 2>/dev/null)
          JSON="$JSON"']'
          echo -e "\n---- sdks ----\n"
          echo "$JSON"
          echo "sdks=$JSON" >> "$GITHUB_OUTPUT"

      - name: Output matrix
        id: out
        run: echo "sdks=${{ steps.find_targets.outputs.sdks }}" >> "$GITHUB_OUTPUT"

  gather_matrix:
    name: Gather build matrices
    runs-on: ubuntu-latest
    needs: generate_matrix
    outputs:
      result: ${{ steps.gather.outputs.result }}
    steps:
      - name: Read matrices
        id: read
        uses: actions/download-artifact@v4
        with:
          path: ./matrices
          pattern: matrix-*
          merge-multiple: true
      - name: Gather matrices
        id: gather
        run: |
          # Use step outputs directly
          result='[]'
          for ref in openwrt-24.10 openwrt-25.12; do
            # Read from step outputs
            json=$(echo '${{ needs.generate_matrix.outputs.sdks }}' 2>/dev/null || echo '[]')
            if [ "$json" != "[]" ]; then
              result=$(echo "$result" "$json" | jq -c -s 'add')
            fi
          done
          # Fallback: use step outputs from generate_matrix
          echo "result=${{ needs.generate_matrix.outputs.sdks }}" >> "$GITHUB_OUTPUT"

  release:
    name: Build ${{ matrix.arch }} (${{ matrix.ref }})
    runs-on: ubuntu-latest
    needs: [generate_matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate_matrix.outputs.sdks) }}
    steps:
      - name: Checkout source (peditx/peditxos-aigate)
        uses: actions/checkout@v4
        with:
          repository: peditx/peditxos-aigate
          token: ${{ secrets.PEDITX_PAT }}

      - name: Build Package
        uses: moetayuko/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          EXTRA_FEEDS: src-git|aigate|https://github.com/peditx/peditxos-aigate
          V: s
          FORCE_UNSAFE_CONFIGURE: 1

      - name: Collect artifacts
        id: artifacts
        run: |
          PKG_DIR="bin/packages/${{ matrix.arch }}/base"
          echo "pkg_dir=$PKG_DIR" >> $GITHUB_OUTPUT
          find "$PKG_DIR" -name 'luci-app-aigate_*.apk' -o -name 'luci-app-aigate_*.ipk' | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-aigate-${{ matrix.ref }}-${{ matrix.arch }}
          path: ${{ steps.artifacts.outputs.pkg_dir }}/luci-app-aigate_*.{apk,ipk}
          retention-days: 7

