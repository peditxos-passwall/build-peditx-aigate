name: AiGate SDK Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.6.0)'
        required: true
        type: string
      openwrt_version:
        description: 'OpenWrt version (24.10 or 25.12)'
        required: true
        default: '25.12'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.arch }} (OpenWrt ${{ matrix.openwrt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 25.12 - CONFIRMED WORKING TARGETS ONLY
          - arch: x86_64
            openwrt: '25.12'
            target: x86
            subtarget: '64'
          - arch: aarch64_cortex-a53
            openwrt: '25.12'
            target: qualcommax
            subtarget: ipq807x
          - arch: aarch64_generic
            openwrt: '25.12'
            target: rockchip
            subtarget: armv8
          - arch: arm_cortex-a7
            openwrt: '25.12'
            target: sunxi
            subtarget: cortexa7
          - arch: mipsel_24kc
            openwrt: '25.12'
            target: ramips
            subtarget: mt7621
          - arch: mips_24kc
            openwrt: '25.12'
            target: ath79
            subtarget: generic
          # 24.10 - CONFIRMED WORKING
          - arch: x86_64
            openwrt: '24.10'
            target: x86
            subtarget: '64'
          - arch: aarch64_cortex-a53
            openwrt: '24.10'
            target: qualcommax
            subtarget: ipq807x
          - arch: aarch64_generic
            openwrt: '24.10'
            target: rockchip
            subtarget: armv8
          - arch: arm_cortex-a7
            openwrt: '24.10'
            target: sunxi
            subtarget: cortexa7
          - arch: mipsel_24kc
            openwrt: '24.10'
            target: ramips
            subtarget: mt7621
          - arch: mips_24kc
            openwrt: '24.10'
            target: ath79
            subtarget: generic

    steps:
      - name: Checkout source (peditx/peditxos-aigate)
        uses: actions/checkout@v4
        with:
          repository: peditx/peditxos-aigate
          token: ${{ secrets.PEDITX_PAT }}

      - name: Set up OpenWrt SDK (${{ matrix.openwrt }})
        uses: openwrt/gh-action-sdk@v1
        with:
          version: ${{ matrix.openwrt }}
          target: ${{ matrix.target }}
          subtarget: ${{ matrix.subtarget }}

      - name: Add peditxos-aigate feed
        run: |
          echo "src-git aigate https://github.com/peditx/peditxos-aigate" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build package
        run: |
          make package/luci-app-aigate/compile V=s
        env:
          FORCE_UNSAFE_CONFIGURE: 1

      - name: Collect artifacts
        id: artifacts
        run: |
          PKG_DIR="bin/packages/${{ matrix.arch }}/base"
          echo "pkg_dir=$PKG_DIR" >> $GITHUB_OUTPUT
          find "$PKG_DIR" -name 'luci-app-aigate_*.apk' -o -name 'luci-app-aigate_*.ipk' | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-aigate-${{ matrix.openwrt }}-${{ matrix.arch }}
          path: ${{ steps.artifacts.outputs.pkg_dir }}/luci-app-aigate_*.{apk,ipk}
          retention-days: 7

  release:
    name: Create Release on peditx/peditxos-aigate
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: luci-app-aigate-*
          merge-multiple: true

      - name: Prepare release assets
        id: prep
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "name=PeDItXOS-AiGate v$VERSION" >> $GITHUB_OUTPUT
          find . -name '*.apk' -o -name '*.ipk' | sort | xargs sha256sum > SHA256SUMS.txt
          echo "checksums=$(cat SHA256SUMS.txt)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (on peditx/peditxos-aigate)
        uses: softprops/action-gh-release@v2
        with:
          repository: peditx/peditxos-aigate
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ steps.prep.outputs.name }}
          body: |
            ## PeDItXOS-AiGate v${{ github.event.inputs.version }}

            ### Install
            \`\`\`sh
            # On OpenWrt 25.12 (apk)
            apk add --allow-untrusted luci-app-aigate-<version>-<arch>.apk

            # On OpenWrt 24.10 (opkg)
            opkg install luci-app-aigate_<version>_<arch>.ipk
            \`\`\`

            ### Checksums
            \`\`\`
            ${{ steps.prep.outputs.checksums }}
            \`\`\`

            Built from commit ${{ github.sha }} on OpenWrt ${{ github.event.inputs.openwrt_version }}.
          files: |
            **/*.apk
            **/*.ipk
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.PEDITX_PAT }}
